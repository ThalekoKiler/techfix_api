<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameWish - Dashboard</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🎮 GameWish</h1>
            <p>Gerenciador de Jogos & Lista de Desejos</p>
        </header>

        <!-- Painel de Estatísticas Pessoais -->
        <section class="card full-width hidden" id="stats-panel">
            <h2>📊 Suas Estatísticas</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-number" id="stat-total">0</span>
                    <span class="stat-label">Total de Jogos</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="stat-concluidos">0</span>
                    <span class="stat-label">Concluídos</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="stat-jogando">0</span>
                    <span class="stat-label">Jogando</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="stat-desejados">0</span>
                    <span class="stat-label">Desejados</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="stat-media">0.0</span>
                    <span class="stat-label">Média das Notas</span>
                </div>
            </div>
        </section>

        <div class="grid">
            <!-- Painel de Autenticação -->
            <section class="card" id="auth-painel">
                <h2>Área de Acesso</h2>

                <div id="auth-forms">
                    <form id="form-login">
                        <h3>Login</h3>
                        <input type="email" id="login-email" placeholder="Email" required>
                        <input type="password" id="login-password" placeholder="Senha" required>
                        <button type="submit">Entrar</button>
                    </form>

                    <hr>

                    <form id="form-register">
                        <h3>Criar Conta</h3>
                        <input type="text" id="reg-name" placeholder="Nome" required>
                        <input type="email" id="reg-email" placeholder="Email" required>
                        <input type="password" id="reg-password" placeholder="Senha (mín. 6 chars)" required>
                        <button type="submit" class="btn-secondary">Cadastrar</button>
                    </form>
                </div>

                <div id="user-info" class="hidden">
                    <p>Conectado como: <strong id="logged-user-name"></strong></p>
                    <button id="btn-logout" class="btn-danger" onclick="logoutUser()">Sair</button>
                </div>
            </section>

            <!-- Cadastro de Novo Jogo -->
            <section class="card" id="game-form-painel">
                <h2>Novo Jogo</h2>
                <form id="form-game" enctype="multipart/form-data">
                    <input type="text" id="game-title" placeholder="Título (ex: Elden Ring)" required>
                    <input type="text" id="game-genre" placeholder="Gênero (ex: Soulslike)" required>
                    <input type="text" id="game-platform" placeholder="Plataforma (ex: PC, PS5)" required>
                    <input type="number" id="game-rating" placeholder="Nota (0 a 10)" step="0.5" min="0" max="10">

                    <select id="game-status">
                        <option value="desejado">Desejado</option>
                        <option value="jogando">Jogando</option>
                        <option value="concluido">Concluído</option>
                        <option value="abandonado">Abandonado</option>
                    </select>

                    <label class="file-label">Capa do Jogo (Opcional):</label>
                    <input type="file" id="game-image" accept="image/png, image/jpeg, image/jpg">

                    <button type="submit">Adicionar Jogo</button>
                </form>
            </section>
        </div>

        <!-- Barra de Filtros e Busca -->
        <section class="card full-width filter-card">
            <div class="filter-grid">
                <input type="text" id="filter-search" placeholder="Buscar por título...">
                <input type="text" id="filter-platform" placeholder="Filtrar por plataforma (ex: PC)...">
                <button id="btn-filter" class="btn-secondary">Filtrar</button>
                <button id="btn-clear-filter" class="btn-danger">Limpar</button>
            </div>
        </section>

        <!-- Catálogo de Jogos -->
        <section class="card full-width">
            <div class="list-header">
                <h2 id="catalog-title">Catálogo Comunitário</h2>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button id="btn-toggle-view" class="btn-secondary">📁 Ver Meus Jogos</button>
                    <a href="/games/export/excel" class="btn-secondary"
                        style="text-decoration: none; display: inline-flex; align-items: center; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.9rem;">
                        📊 Baixar Excel
                    </a>
                    <button id="btn-reload" class="btn-secondary">Atualizar</button>
                </div>
            </div>
            <div id="games-container" class="games-grid">
                <p class="placeholder-text">Carregando jogos...</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
